<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>信用卡記帳</title>
<style>
:root{--bg:#f7f4ff;--card:#fff;--text:#2b2540;--muted:#8a829a;--line:#e9e3f3;--accent:#8f7bd8;--shadow:0 10px 28px rgba(70,52,120,.10)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:90px}header{position:sticky;top:0;z-index:20;padding:18px 14px 10px;background:rgba(247,244,255,.95);backdrop-filter:blur(12px)}h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.page{display:none;padding:8px 14px 20px}.page.active{display:block}.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}h2{font-size:17px;margin:0 0 14px}.field{margin-bottom:13px}label{display:block;font-size:12px;font-weight:800;color:#6d6582;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fcfbff;color:var(--text);outline:none}textarea{min-height:78px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:13px 14px;font-weight:900}.primary{width:100%;background:linear-gradient(135deg,#8f7bd8,#a58ae5);color:#fff}.danger{background:#fff0f2;color:#ae4d5d}.toggleLine{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#faf8ff}.toggle{width:44px;height:26px;border-radius:999px;background:#ddd7eb;position:relative;flex:none}.toggle:after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.12)}.toggle.on{background:var(--accent)}.toggle.on:after{transform:translateX(18px)}.hidden{display:none!important}.cycle{background:linear-gradient(135deg,#eee9ff,#fbfaff);border:1px solid #ddd4fa;border-radius:16px;padding:13px;margin-bottom:14px}.cycle small{color:var(--muted)}.cycle strong{display:block;font-size:16px;margin-top:4px}.cycle p{font-size:12px;color:var(--muted);margin:4px 0 0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.sum{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.sum small{color:var(--muted);font-size:11px}.sum strong{display:block;font-size:20px;margin-top:4px}.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.tabs::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;color:#746b88;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900;white-space:nowrap}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.legend{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.legend span{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;white-space:nowrap}.l-ctbc{background:#eaf4f9}.l-cathay{background:#ebf8f0}.l-taishin{background:#fff0f0}.l-fubon{background:#fff7e4}.record{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;background:#fff}.ctbc{background:#f1f8fb;border-color:#cfe5ee}.cathay{background:#f1faf5;border-color:#cfe7d8}.taishin{background:#fff5f5;border-color:#efd4d4}.fubon{background:#fff9ec;border-color:#eddcaf}.rtop{display:flex;justify-content:space-between;gap:10px}.date{font-size:12px;color:var(--muted)}.item{font-size:15px;font-weight:900;margin-top:3px}.bank{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.7);white-space:nowrap}.money{font-size:19px;font-weight:900;margin-top:12px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.rfoot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,.05)}.status{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#e9f6ef;color:#47725e}.actions{display:flex;gap:7px}.mini{border:0;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900}.edit{background:#efeafd;color:#6754aa}.del{background:#fff0f2;color:#aa4d5d}.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px}.remind{background:#fff8e9;border:1px solid #ead9aa;border-radius:18px;padding:14px;margin-bottom:10px}.remind.due{background:#fff1f1;border-color:#e8c4c4}.remTop{display:flex;justify-content:space-between;gap:10px}.remTitle{font-weight:900}.tag{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:#fff0c8;color:#88661f;white-space:nowrap}.remind.due .tag{background:#ffe0e0;color:#a04c4c}.remMeta{font-size:12px;color:var(--muted);margin-top:4px}.donePay{width:100%;margin-top:11px;border:0;border-radius:12px;padding:11px;background:var(--accent);color:#fff;font-weight:900}.nextInfo{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:12px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,480px);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav button{border:0;background:transparent;color:#8d849f;font-size:11px;font-weight:900;padding:7px}.nav button.active{color:#7059bd}.nav .ico{display:block;font-size:21px;margin-bottom:2px}.topBtn{position:fixed;right:max(16px,calc((100vw - 480px)/2 + 16px));bottom:92px;width:44px;height:44px;border:0;border-radius:50%;background:#745fc2;color:#fff;font-size:20px;box-shadow:0 8px 18px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s;z-index:25}.topBtn.show{opacity:1;pointer-events:auto}.modal{position:fixed;inset:0;background:rgba(30,24,50,.32);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.sheet{width:min(100%,480px);max-height:88vh;overflow:auto;margin:auto auto 0;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheetHead h3{margin:0}.close{border:0;background:#f2eefb;width:34px;height:34px;border-radius:50%}
</style>
</head><body>
<div class="app"><header><h1>💳 信用卡記帳</h1><div class="sub">手機版前端・目前資料暫存在瀏覽器</div></header>
<section id="addPage" class="page active"><div class="box"><h2>新增刷卡紀錄</h2><div class="field"><label>銀行</label><select id="bankSel"><option>中信</option><option>國泰</option><option>台新</option><option>富邦</option></select></div><div class="field" id="cardField"><label>中信卡別</label><select id="cardSel"><option>無限卡VISA</option><option>UniOpen卡</option><option>line pay卡</option><option>無限卡JCB</option><option>Sogo聯名卡</option></select></div><div class="row"><div class="field"><label>刷卡日期</label><input id="dateInp" type="date"></div><div class="field"><label>進度</label><select id="statusSel"><option>刷</option><option>繳</option></select></div></div><div class="cycle"><small>預計寫入帳期</small><strong id="cycleTitle"></strong><p id="cycleRange"></p></div><div class="field"><label>項目</label><input id="itemInp" placeholder="例如：Olive Young"></div><div class="field"><label>台幣金額</label><input id="twdInp" type="number" inputmode="decimal" placeholder="可留空，之後再補"></div><div class="field"><label>外幣消費</label><div class="toggleLine" id="foreignLine"><div id="foreignToggle" class="toggle"></div><div><b style="font-size:14px">這筆是外幣消費</b><div class="sub">開啟後可輸入幣別與外幣金額</div></div></div></div><div id="foreignFields" class="hidden"><div class="row"><div class="field"><label>幣別</label><select id="currencySel"><option>KRW</option><option>JPY</option><option>USD</option><option>EUR</option></select></div><div class="field"><label>外幣金額</label><input id="foreignInp" type="number" inputmode="decimal"></div></div></div><div class="field"><label>備註</label><textarea id="noteInp"></textarea></div><button id="saveBtn" class="btn primary">儲存刷卡紀錄</button></div></section>
<section id="recordsPage" class="page"><div id="reminders"></div><div id="nextInfo" class="nextInfo"></div><div class="summary"><div class="sum"><small>這個月筆數</small><strong id="countVal">0</strong></div><div class="sum"><small>台幣合計</small><strong id="totalVal">NT$0</strong></div></div><div style="font-size:12px;font-weight:900;color:#6e6683;margin:3px 0 7px">月份</div><div id="monthTabs" class="tabs"></div><div class="legend"><span class="l-ctbc">中信</span><span class="l-cathay">國泰</span><span class="l-taishin">台新</span><span class="l-fubon">富邦</span></div><div id="bankTabs" class="tabs"><button class="chip active" data-bank="全部">全部銀行</button><button class="chip" data-bank="中信">中信</button><button class="chip" data-bank="國泰">國泰</button><button class="chip" data-bank="台新">台新</button><button class="chip" data-bank="富邦">富邦</button></div><div class="field"><input id="searchInp" placeholder="搜尋項目、備註、卡別"></div><div id="recordList"></div></section>
<section id="pendingPage" class="page"><div class="box"><h2>待處理</h2><div class="sub" style="margin-bottom:12px">有外幣金額、但還沒有台幣金額的紀錄會列在這裡。</div><div id="pendingList"></div></div></section></div>
<button id="topBtn" class="topBtn">↑</button><nav class="nav"><button class="active" data-page="addPage"><span class="ico">＋</span>新增</button><button data-page="recordsPage"><span class="ico">▤</span>紀錄</button><button data-page="pendingPage"><span class="ico">◷</span>待處理</button></nav>
<div id="editModal" class="modal"><div class="sheet"><div class="sheetHead"><h3>修改刷卡紀錄</h3><button id="closeEdit" class="close">✕</button></div><input id="editId" type="hidden"><div class="field"><label>銀行</label><select id="editBank"><option>中信</option><option>國泰</option><option>台新</option><option>富邦</option></select></div><div class="field"><label>卡別</label><input id="editCard"></div><div class="row"><div class="field"><label>日期</label><input id="editDate" type="date"></div><div class="field"><label>進度</label><select id="editStatus"><option>刷</option><option>繳</option></select></div></div><div class="field"><label>項目</label><input id="editItem"></div><div class="field"><label>台幣金額</label><input id="editTwd" type="number"></div><div class="row"><div class="field"><label>幣別</label><select id="editCurrency"><option value="">無</option><option>KRW</option><option>JPY</option><option>USD</option><option>EUR</option></select></div><div class="field"><label>外幣金額</label><input id="editForeign" type="number"></div></div><div class="field"><label>備註</label><textarea id="editNote"></textarea></div><div class="row"><button id="modalDelete" class="btn danger">刪除</button><button id="modalSave" class="btn primary">儲存修改</button></div></div></div>
<script>
const LS_KEY='cc_records_v1',PAY_KEY='cc_paid_v1';
const seed=[{id:1,bank:'中信',card:'無限卡VISA',date:'2026-10-09',item:'Olive Young',twd:3460,currency:'KRW',foreign:144500,status:'刷',note:''},{id:2,bank:'國泰',card:'',date:'2026-10-10',item:'午餐-豬肉湯飯',twd:752,currency:'KRW',foreign:31500,status:'刷',note:''},{id:3,bank:'台新',card:'',date:'2026-10-15',item:'萬聖節三麗鷗盲盒*4',twd:1596,currency:'',foreign:null,status:'刷',note:''},{id:4,bank:'富邦',card:'',date:'2026-10-08',item:'秀泰 IU電影票*1',twd:1140,currency:'',foreign:null,status:'刷',note:'被請款'},{id:5,bank:'中信',card:'line pay卡',date:'2026-10-16',item:'待補台幣示範',twd:null,currency:'KRW',foreign:50000,status:'刷',note:'這筆會出現在待處理'}];
let records=JSON.parse(localStorage.getItem(LS_KEY)||'null')||seed,paid=JSON.parse(localStorage.getItem(PAY_KEY)||'{}'),currentMonth='',bankFilter='全部';
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),persist=()=>localStorage.setItem(LS_KEY,JSON.stringify(records)),persistPaid=()=>localStorage.setItem(PAY_KEY,JSON.stringify(paid));
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmtMoney(n){return n==null||n===''?'待補':'NT$'+Number(n).toLocaleString()}function monthKey(d){return d?d.slice(0,7):''}function bankClass(b){return b==='中信'?'ctbc':b==='國泰'?'cathay':b==='台新'?'taishin':'fubon'}
function getCycle(day,date){const d=new Date(date+'T12:00:00');let y=d.getFullYear(),m=d.getMonth()+1;if(d.getDate()<day){m--;if(m===0){m=12;y--}}const s=new Date(y,m-1,day,12);let ey=y,em=m+1;if(em===13){em=1;ey++}const e=new Date(ey,em-1,day,12);e.setDate(e.getDate()-1);return{tab:`${String(y).slice(-2)}/${pad(m)}/${pad(day)}`,s,e}}function fmtDate(d){return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`}
function updateCycle(){const b=$('bankSel').value,d=$('dateInp').value;$('cardField').classList.toggle('hidden',b!=='中信');if(b==='中信'){const c=getCycle(6,d);$('cycleTitle').textContent=`中信｜${c.tab}`;$('cycleRange').textContent=`${fmtDate(c.s)} ～ ${fmtDate(c.e)}`}else if(b==='國泰'){const c=getCycle(9,d);$('cycleTitle').textContent=`國泰｜${c.tab}`;$('cycleRange').textContent=`${fmtDate(c.s)} ～ ${fmtDate(c.e)}`}else{$('cycleTitle').textContent=`${b}｜帳期規則待確認`;$('cycleRange').textContent='等下期帳單確認後再補上'}}
$('dateInp').value=new Date().toISOString().slice(0,10);$('bankSel').onchange=updateCycle;$('dateInp').onchange=updateCycle;$('foreignLine').onclick=()=>{$('foreignToggle').classList.toggle('on');$('foreignFields').classList.toggle('hidden',!$('foreignToggle').classList.contains('on'))};
$('saveBtn').onclick=()=>{if(!$('itemInp').value.trim()){alert('請先輸入項目');return}const f=$('foreignToggle').classList.contains('on');records.unshift({id:Date.now(),bank:$('bankSel').value,card:$('bankSel').value==='中信'?$('cardSel').value:'',date:$('dateInp').value,item:$('itemInp').value.trim(),twd:$('twdInp').value?Number($('twdInp').value):null,currency:f?$('currencySel').value:'',foreign:f&&$('foreignInp').value?Number($('foreignInp').value):null,status:$('statusSel').value,note:$('noteInp').value.trim()});persist();$('itemInp').value=$('twdInp').value=$('foreignInp').value=$('noteInp').value='';buildMonths();renderRecords();renderPending();alert('已儲存到目前瀏覽器的前端測試資料')};
document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(btn.dataset.page).classList.add('active');if(btn.dataset.page==='recordsPage'){renderReminders();renderRecords()}if(btn.dataset.page==='pendingPage')renderPending();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('#bankTabs .chip').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('#bankTabs .chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');bankFilter=btn.dataset.bank;renderRecords()});$('searchInp').oninput=renderRecords;
function buildMonths(){const months=[...new Set(records.map(r=>monthKey(r.date)).filter(Boolean))].sort().reverse();if(!currentMonth||!months.includes(currentMonth))currentMonth=months[0]||'';$('monthTabs').innerHTML=months.map(m=>`<button class="chip ${m===currentMonth?'active':''}" data-m="${m}">${Number(m.slice(5))}月</button>`).join('');$('monthTabs').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{currentMonth=b.dataset.m;buildMonths();renderRecords()})}
function renderRecords(){const q=$('searchInp').value.trim().toLowerCase();let list=records.filter(r=>monthKey(r.date)===currentMonth&&(bankFilter==='全部'||r.bank===bankFilter));if(q)list=list.filter(r=>(r.item+' '+r.note+' '+r.card).toLowerCase().includes(q));$('countVal').textContent=list.length;$('totalVal').textContent='NT$'+list.reduce((s,r)=>s+(Number(r.twd)||0),0).toLocaleString();$('recordList').innerHTML=list.length?list.map(r=>`<div class="record ${bankClass(r.bank)}"><div class="rtop"><div><div class="date">${r.date}</div><div class="item">${esc(r.item)}</div></div><div class="bank">${esc(r.bank)}${r.card?'・'+esc(r.card):''}</div></div><div class="money">${fmtMoney(r.twd)}</div>${r.foreign?`<div class="meta">${r.currency} ${Number(r.foreign).toLocaleString()}</div>`:''}${r.note?`<div class="meta">備註：${esc(r.note)}</div>`:''}<div class="rfoot"><span class="status">${esc(r.status)}</span><div class="actions"><button class="mini edit" onclick="openEdit(${r.id})">修改</button><button class="mini del" onclick="deleteRec(${r.id})">刪除</button></div></div></div>`).join(''):'<div class="empty">這個條件下沒有紀錄</div>'}
function renderPending(){const list=records.filter(r=>r.foreign&&!r.twd);$('pendingList').innerHTML=list.length?list.map(r=>`<div class="record ${bankClass(r.bank)}"><div class="date">${r.date}</div><div class="item">${esc(r.item)}</div><div class="money">${r.currency} ${Number(r.foreign).toLocaleString()}</div><div class="meta">${r.bank}・待補台幣</div><div class="rfoot"><span class="status">待補</span><button class="mini edit" onclick="openEdit(${r.id})">補金額</button></div></div>`).join(''):'<div class="empty">目前沒有待補台幣金額</div>'}
function openEdit(id){const r=records.find(x=>x.id===id);if(!r)return;$('editId').value=r.id;$('editBank').value=r.bank;$('editCard').value=r.card||'';$('editDate').value=r.date;$('editStatus').value=r.status;$('editItem').value=r.item;$('editTwd').value=r.twd??'';$('editCurrency').value=r.currency||'';$('editForeign').value=r.foreign??'';$('editNote').value=r.note||'';$('editModal').classList.add('show')}$('closeEdit').onclick=()=>$('editModal').classList.remove('show');$('editModal').onclick=e=>{if(e.target===$('editModal'))$('editModal').classList.remove('show')};$('modalSave').onclick=()=>{const r=records.find(x=>x.id===Number($('editId').value));if(!r)return;r.bank=$('editBank').value;r.card=r.bank==='中信'?$('editCard').value.trim():'';r.date=$('editDate').value;r.status=$('editStatus').value;r.item=$('editItem').value.trim();r.twd=$('editTwd').value?Number($('editTwd').value):null;r.currency=$('editCurrency').value;r.foreign=$('editForeign').value?Number($('editForeign').value):null;r.note=$('editNote').value.trim();persist();$('editModal').classList.remove('show');buildMonths();renderRecords();renderPending()};function deleteRec(id){if(!confirm('確定刪除這筆紀錄？'))return;records=records.filter(r=>r.id!==id);persist();buildMonths();renderRecords();renderPending()}$('modalDelete').onclick=()=>{const id=Number($('editId').value);$('editModal').classList.remove('show');deleteRec(id)};
function renderReminders(){const now=new Date(),y=now.getFullYear(),m=now.getMonth()+1,d=now.getDate(),sched={'中信':23,'國泰':24};let cards=[],future=[];for(const[bank,due]of Object.entries(sched)){const key=`${bank}-${y}-${pad(m)}`;if(paid[key])continue;if(d>=due-1){const label=d===due-1?'明天要繳費':d===due?'今天到期':`已逾期 ${d-due} 天`;cards.push(`<div class="remind ${d>=due?'due':''}"><div class="remTop"><div><div class="remTitle">${bank}信用卡繳費提醒</div><div class="remMeta">本月繳費期限：${m}/${due}</div></div><div class="tag">${label}</div></div><button class="donePay" onclick="markPaid('${bank}',${y},${m})">完成繳費</button></div>`)}else future.push(`${bank}：${m}/${due-1} 開始提醒，${m}/${due} 到期`)}$('reminders').innerHTML=cards.join('');$('nextInfo').innerHTML=future.length?future.join('<br>'):(cards.length?'台新、富邦繳費日待確認後再加入。':'本月目前沒有待繳提醒')}function markPaid(bank,y,m){paid[`${bank}-${y}-${pad(m)}`]=true;persistPaid();renderReminders()}
window.addEventListener('scroll',()=>$('topBtn').classList.toggle('show',window.scrollY>420));$('topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});updateCycle();buildMonths();renderReminders();renderRecords();renderPending();
</script></body></html>
